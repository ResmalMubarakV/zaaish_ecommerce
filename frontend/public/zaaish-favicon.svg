<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E6BD"/>
      <stop offset="35%" stop-color="#E2BA6E"/>
      <stop offset="70%" stop-color="#C5963E"/>
      <stop offset="100%" stop-color="#9E7427"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1817"/>
      <stop offset="100%" stop-color="#090807"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E2BA6E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Dark Rounded Canvas -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="128" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Crown / Diamond Top Accent -->
  <path d="M256 100 L275 125 L256 140 L237 125 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

  <!-- Serif Monogram "Z" -->
  <text 
    x="50%" 
    y="66%" 
    font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', serif" 
    font-size="280" 
    font-weight="400" 
    font-style="italic"
    fill="url(#goldGrad)" 
    text-anchor="middle" 
    dominant-baseline="central"
    filter="url(#goldGlow)"
  >Z</text>
</svg>
